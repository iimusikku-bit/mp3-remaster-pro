<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP3 Remaster Pro</title>
<style>body{margin:0;font-family:Arial;background:#eaf8ff;color:#123}.wrap{max-width:720px;margin:auto;padding:22px}.hero{padding:26px;border-radius:24px;background:linear-gradient(135deg,#1597e5,#68cbff);color:#fff}.card{background:#fff;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 5px 20px #1597e522}input,select,button{width:100%;padding:14px;margin-top:8px;border-radius:12px;border:1px solid #c8eafa;box-sizing:border-box;font-size:16px}button{background:#1597e5;color:white;border:0;font-weight:bold}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:13px;color:#58717f;line-height:1.5}audio{width:100%;margin-top:12px}</style></head><body><div class="wrap"><div class="hero"><h1>🎧 MP3 REMASTER PRO</h1><div>Remaster MP3 dengan FFmpeg server.</div></div>
<div class="card"><input id="file" type="file" accept=".mp3,.wav,.flac,.m4a,.aac,.ogg,audio/*"><div id="info" class="small">Pilih file audio.</div></div>
<div class="card"><label>Preset</label><select id="preset"><option value="clean">Clean Master</option><option value="vocal">Vocal Clear</option><option value="bass">Bass Punch</option><option value="loud">Loud & Clean</option><option value="gentle">Gentle Remaster</option></select>
<div class="row"><div><label>Clarity</label><input id="clarity" type="range" min="0" max="100" value="55"></div><div><label>Loudness</label><input id="loud" type="range" min="0" max="100" value="70"></div></div>
<label>Output</label><select id="bitrate"><option value="320k">320 kbps</option><option value="256k">256 kbps</option><option value="192k">192 kbps</option></select><button id="go">✨ REMASTER SEKARANG</button><div id="status" class="small">Siap.</div></div>
<div id="result" class="card" style="display:none"><h3>Hasil Remaster</h3><audio id="player" controls></audio><a id="download"><button>⬇️ DOWNLOAD MP3</button></a></div></div>
<script>const $=id=>document.getElementById(id);$('file').onchange=()=>{let f=$('file').files[0];$('info').textContent=f?`✅ ${f.name} • ${(f.size/1048576).toFixed(2)} MB`:'Pilih file audio.'};$('go').onclick=async()=>{let f=$('file').files[0];if(!f){$('status').textContent='Pilih MP3 terlebih dahulu.';return}$('go').disabled=true;$('status').textContent='Mengupload dan meremaster…';let fd=new FormData();fd.append('file',f);fd.append('preset',$('preset').value);fd.append('clarity',$('clarity').value);fd.append('loudness',$('loud').value);fd.append('bitrate',$('bitrate').value);try{let r=await fetch('/api/remaster',{method:'POST',body:fd});let j=await r.json();if(j.error)throw Error(j.error);$('player').src=j.download;$('download').href=j.download;$('download').download=j.filename;$('result').style.display='block';$('status').textContent='✅ Selesai.'}catch(e){$('status').textContent='❌ '+e.message}finally{$('go').disabled=false}};</script></body></html>
